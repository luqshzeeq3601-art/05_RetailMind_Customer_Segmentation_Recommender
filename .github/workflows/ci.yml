name: RetailMind CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install --no-deps -e .

      - name: Run Ruff Linter
        run: |
          python -m ruff check .

      - name: Run Pytest Test Suite
        run: |
          python -m pytest -q -p no:cacheprovider --basetemp .pytest_tmp

      - name: Build dashboard image
        run: docker build -t retailmind:ci .

      - name: Verify mounted release dashboard
        run: |
          chmod -R a+rX artifacts/release
          docker run -d --name retailmind-ci -p 127.0.0.1:8501:8501 \
            --mount type=bind,source="$PWD/artifacts/release",target=/app/artifacts/release,readonly \
            retailmind:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health; then break; fi
            sleep 2
          done
          curl --fail http://127.0.0.1:8501/_stcore/health
          python -m playwright install --with-deps chromium
          python tests/verify_browser.py

      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs retailmind-ci || true
          docker rm -f retailmind-ci || true
