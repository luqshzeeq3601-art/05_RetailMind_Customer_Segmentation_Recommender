[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "retailmind"
version = "0.1.0"
description = "Customer segmentation and product recommendations from retail purchase history"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "ZeeqRyz" }
]
dependencies = [
    "pandas>=2.1.0",
    "numpy>=1.26.0,<2.0.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "openpyxl>=3.1.2",
    "pyarrow>=14.0.0",
    "pyyaml>=6.0.1",
    "pydantic>=2.5.0",
    "streamlit>=1.30.0",
    "plotly>=5.18.0",
    "mlflow>=2.10.0",
    "requests>=2.31.0",
    "joblib>=1.3.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.2.0",
    "playwright>=1.40.0",
    "httpx>=0.25.0",
]

[project.scripts]
retailmind = "retailmind.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
